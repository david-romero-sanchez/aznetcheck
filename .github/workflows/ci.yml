name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore AzNetCheck.sln
      - run: dotnet build AzNetCheck.sln --configuration Release --no-restore
      - run: dotnet test AzNetCheck.sln --configuration Release --no-build